        body {
            font-family: 'Segoe UI', 'Inter', sans-serif;
            background: #0b1120;
            height: 100vh;
            overflow: hidden;
            color: #f0f4fa;
        }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #030712; }

        /* HEADER */
        .header {
            position: fixed; top: 20px; left: 20px; z-index: 30;
            background: rgba(0,0,0,0.70);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            padding: 0.75rem 1.4rem;
            border-left: 5px solid #eab308;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .header h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px; }
        .header h1 i { color: #eab308; margin-right: 8px; }
        .header p { font-size: 0.68rem; opacity: 0.75; margin-top: 4px; }

        /* SIDEBAR */
        .sidebar {
            position: absolute; top: 110px; left: 20px; width: 272px;
            background: rgba(10,18,38,0.92);
            backdrop-filter: blur(14px);
            border-radius: 20px; z-index: 20; padding: 0.9rem; padding-bottom: 0rem;
            border: 1px solid rgba(255,215,0,0.25);
            max-height: calc(100% - 190px);
            display: flex;
            flex-direction: column;
            overflow: hidden;            /* empêche le scroll global */

        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(234,179,8,0.4); border-radius: 4px; }

        .sidebar-header {
            display: flex; align-items: center; gap: 8px;
            font-size: 1rem; font-weight: 700; margin-bottom: 0.8rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px solid rgba(234,179,8,0.5);
            flex-shrink: 0;              /* empêche ces éléments de rétrécir */

        }
        .sidebar-header i { color: #eab308; }
        .sidebar-count {
            margin-left: auto; background: rgba(234,179,8,0.2);
            color: #eab308; font-size: 0.65rem; font-weight: 700;
            padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(234,179,8,0.4);
        }

        .search-bar {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(234,179,8,0.25);
            border-radius: 10px; padding: 7px 11px;
            margin-bottom: 10px;
        }
        .search-bar i { color: #eab308; font-size: 0.8rem; flex-shrink: 0; }
        .search-bar input {
            background: none; border: none; outline: none;
            color: #f0f4fa; font-size: 0.8rem; width: 100%;
            font-family: inherit;
        }
        .search-bar input::placeholder { color: rgba(240,244,250,0.4); }

        .filter-chip {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(234,179,8,0.2);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 0.7rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            flex-shrink: 0;              /* empêche ces éléments de rétrécir */

        }
        .filter-chip:hover { background: rgba(234,179,8,0.15); }
        .filter-chip.active {
            background: rgba(234,179,8,0.25);
            border-color: #eab308;
            color: #eab308;
        }

        #reset-view-btn {
            flex-shrink: 0;              /* empêche ces éléments de rétrécir */
            margin-top: 10px; margin-bottom: 0; 
        }

        .scrollable-list {
            flex: 1;                     /* prend tout l'espace restant */
            overflow-y: auto;            /* active le scroll vertical */
            margin-top: 0.5rem;          /* petite marge de séparation */
            padding-right: 2px;          /* éviter que la scrollbar chevauche le contenu */
        }

        .scrollable-list::-webkit-scrollbar {
            width: 4px;
        }
        .scrollable-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollable-list::-webkit-scrollbar-thumb {
            background: rgba(234,179,8,0.4);
            border-radius: 4px;
        }



        /* Liste stades */
        .item-card {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 11px; margin-bottom: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 12px; cursor: pointer;
            transition: all 0.18s ease;
            border: 1px solid transparent;
        }
        .item-card:hover {
            background: rgba(234,179,8,0.15);
            transform: translateX(3px);
            border-color: rgba(234,179,8,0.5);
        }
        .item-card.active {
            background: rgba(234,179,8,0.22);
            border-color: #eab308;
        }
        .item-icon { font-size: 1.4rem; flex-shrink: 0; }
        .item-name { font-weight: 600; font-size: 0.82rem; line-height: 1.2; }
        .item-sub { font-size: 0.65rem; opacity: 0.65; margin-top: 2px; }

        /* Logo / ballon */
        .logo-fifa {
            position: fixed; top: 20px; right: 20px; width: 64px;
            background: rgba(0,0,0,0.45); border-radius: 14px;
            padding: 7px; backdrop-filter: blur(4px); z-index: 30;
        }
        .balloon-fifa {
            position: fixed; bottom: 28px; right: 28px;
            width: 72px; height: 72px;
            background-image: url('https://upload.wikimedia.org/wikipedia/en/thumb/e/ec/FIFA_World_Cup_2026.svg/1200px-FIFA_World_Cup_2026.svg.png');
            background-size: contain; background-repeat: no-repeat;
            z-index: 25;
            animation: floatBall 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 14px rgba(234,179,8,0.6));
        }
        @keyframes floatBall {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Bouton bascule */
        .switch-btn {
            position: fixed; bottom: 28px; left: 20px;
            background: rgba(10,18,38,0.9);
            color: #f0f4fa; border: 1px solid rgba(234,179,8,0.4);
            border-radius: 40px; padding: 11px 22px;
            font-weight: 700; font-size: 0.82rem;
            cursor: pointer; z-index: 30;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .switch-btn:hover { background: #eab308; color: #0f172a; transform: scale(1.03); }

        /* POPUPS */
        .maplibregl-popup { z-index: 50; }
        .custom-popup .maplibregl-popup-content {
            background: linear-gradient(145deg, #0d1a30, #08101f);
            color: #f0f4fa; border-radius: 18px;
            padding: 14px !important;
            border: 1px solid rgba(234,179,8,0.45);
            min-width: 250px; max-width: 280px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        .custom-popup .maplibregl-popup-tip { border-top-color: #eab308; }
        .maplibregl-popup-close-button {
            color: #eab308; font-size: 1.1rem;
            right: 10px; top: 8px;
        }
        .popup-title {
            font-size: 1.05rem; font-weight: 800; margin-bottom: 9px;
            border-left: 4px solid #eab308; padding-left: 9px; line-height: 1.25;
        }
        .popup-img {
            width: 100%; height: 135px; object-fit: cover;
            border-radius: 11px; margin-bottom: 10px;
            border: 1px solid rgba(234,179,8,0.2);
        }
        .popup-row {
            font-size: 0.73rem; margin-bottom: 5px;
            display: flex; align-items: flex-start; gap: 7px;
        }
        .popup-row i { width: 16px; color: #eab308; flex-shrink: 0; margin-top: 1px; }
        .popup-badge {

            color: #eab308; font-size: 0.6rem; font-weight: 700;
            padding: 2px 7px; border-radius: 10px; margin-top: 7px;
            border: 1px solid rgba(234,179,8,0.35); letter-spacing: 0.3px;
        }
        .popup-flag { width: 44px; border-radius: 6px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

        .stadium-marker {
            cursor: pointer;
            transition: transform 0.12s;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
        }
        .stadium-marker:hover { transform: scale(1.25) translateY(-2px); }

        /* Marqueur équipe */
        .team-marker {
            font-size: 30px; cursor: pointer; line-height: 1;
            transition: transform 0.12s;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6));
        }
        .team-marker:hover { transform: scale(1.3) translateY(-2px); }

    </div>
    <button id="reset-view-btn" style="

        border-radius:10px; padding:7px; color:#eab308; font-weight:600; font-size:0.75rem;

        <i class="fas fa-undo-alt"></i> Vue d'ensemble
    </button>
</div>

// ======================== SVG MARQUEUR STADE ========================
function createStadiumMarkerEl() {
    const el = document.createElement('div');
    el.className = 'stadium-marker';
    el.innerHTML = `<svg width="38" height="42" viewBox="0 0 38 42" xmlns="http://www.w3.org/2000/svg">
        <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/></filter>
        <g filter="url(#sh)">
            <ellipse cx="19" cy="34" rx="10" ry="4" fill="rgba(0,0,0,0.3)"/>
            <path d="M19 2 C10 2 3 9 3 18 C3 28 19 40 19 40 C19 40 35 28 35 18 C35 9 28 2 19 2Z" fill="#eab308"/>
            <path d="M19 5 C12 5 6 11 6 18 C6 26 19 37 19 37 C19 37 32 26 32 18 C32 11 26 5 19 5Z" fill="#0f172a"/>
            <text x="19" y="21" text-anchor="middle" font-size="13" fill="#eab308">🏟</text>
        </g>
    </svg>`;
    return el;
}

// ======================== POPUPS ========================
function buildStadiumPopup(s) {
    const isSpecial = s.matches.includes('FINALE') || s.matches.includes('ouverture') || s.matches.includes('Demi');
    const badge = isSpecial ? `<span class="popup-badge"><i class="fas fa-star"></i> MATCH CLÉ</span>` : '';
    return `
        <div class="popup-title">${s.flag} ${s.name}</div>
        <img class="popup-img" src="${s.image}" onerror="this.src='https://upload.wikimedia.org/wikipedia/en/thumb/e/ec/FIFA_World_Cup_2026.svg/1200px-FIFA_World_Cup_2026.svg.png'" alt="${s.name}">
        <div class="popup-row"><i class="fas fa-map-marker-alt"></i> ${s.city}, ${s.country}</div>
        <div class="popup-row"><i class="fas fa-users"></i> Capacité : ${s.capacity} places</div>
        <div class="popup-row"><i class="fas fa-calendar"></i> Ouverture : ${s.opened}</div>
        <div class="popup-row"><i class="fas fa-shield-halved"></i> Résident : ${s.resident}</div>
        <div class="popup-row"><i class="fas fa-futbol"></i> ${s.matches}</div>
        ${badge}
    `;
}

function buildTeamPopup(t) {
    const winsStr = t.wcWins > 0 ? `🏆 ${t.wcWins} titre${t.wcWins>1?'s':''}` : 'Aucun titre';
    const rank = FIFA_RANKINGS[t.code] || '—';
    const rankStr = rank !== '—' ? `#${rank}` : 'Non classé';
    
    return `
        <img class="popup-flag" src="${t.flag}" alt="${t.name}" onerror="this.style.display='none'">
        <div class="popup-title">${t.icon} ${t.name} (${t.code})</div>
        <div class="popup-row"><i class="fas fa-trophy"></i> ${winsStr}</div>
        <div class="popup-row"><i class="fas fa-ranking-star"></i> Classement FIFA : ${rankStr}</div>
        <div class="popup-row"><i class="fas fa-person-chalkboard"></i> ${t.coach}</div>
        <div class="popup-row"><i class="fas fa-layer-group"></i> Groupe ${t.group}</div>
        <div class="popup-row"><i class="fas fa-earth-americas"></i> ${t.conf}</div>
        <span class="popup-badge">FIFA World Cup 2026™</span>
    `;
}

function openPopup(lngLat, html) {
    if (activePopup) activePopup.remove();
    activePopup = new maplibregl.Popup({ offset: 25, closeButton: true, closeOnClick: false, className: 'custom-popup' })
        .setLngLat(lngLat)
        .setHTML(html)
        .addTo(map);
}

// ======================== MARQUEURS ========================
function clearAll() {
    stadiumMarkers.forEach(m => m.remove());
    teamMarkers.forEach(m => m.remove());
    stadiumMarkers = []; teamMarkers = [];
    if (hoverPopup) { hoverPopup.remove(); hoverPopup = null; }
    if (activePopup) { activePopup.remove(); activePopup = null; }
    document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
    activeCard = null;
}

function setActiveCard(id) {
    document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
    const el = document.getElementById('card-' + id);
    if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    activeCard = id;
}

// ======================== RESET VIEW ========================
document.getElementById('reset-view-btn').addEventListener('click', () => {
    if (currentMode === 'stadiums') {
        map.flyTo({ center: [-99, 35], zoom: 3.2, pitch: 45, duration: 1200 });
    } else {
        map.flyTo({ center: [10, 20], zoom: 2.0, pitch: 30, duration: 1300 });
    }
    if (activePopup) { activePopup.remove(); activePopup = null; }
    document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
});

// ======================== MODE STADES ========================
function showStadiums() {
    clearAll();
    currentMode = 'stadiums';
    document.getElementById('sidebar-icon').className = 'fas fa-landmark';
    document.getElementById('sidebar-title').textContent = 'Stades hôtes';
    document.getElementById('sidebar-count').textContent = '16';
    document.getElementById('switch-view').innerHTML = '<i class="fas fa-globe-americas"></i> Voir les Nations participantes';
    document.getElementById('legend').classList.remove('visible');
    document.getElementById('stadium-filters').style.display = 'block';
    document.getElementById('team-filters').style.display = 'none';
    document.getElementById('filter-container').style.display = 'block';

    if (map.getLayer('country-fill')) map.setLayoutProperty('country-fill', 'visibility', 'none');
    if (map.getLayer('country-outline')) map.setLayoutProperty('country-outline', 'visibility', 'none');

    // Centrer sur l'Amérique du Nord
    map.flyTo({ center: [-99, 35], zoom: 3.2, pitch: 45, bearing: 0, duration: 1200 });

    // Filtre recherche
    document.addEventListener('input', e => {
        if (e.target.id !== 'search-input') return;
        const q = e.target.value.toLowerCase().trim();
        document.querySelectorAll('.item-card').forEach(card => {
            const text = card.innerText.toLowerCase();
            card.style.display = (!q || text.includes(q)) ? '' : 'none';
        });
    });

    // Réinitialiser les filtres
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.filter-chip[data-filter="all"]').forEach(c => c.classList.add('active'));
    filterState = { country: 'all', capacity: 'all', conf: 'all' };

    // Construire liste sidebar
    const container = document.getElementById('item-list');
    container.innerHTML = '';
    STADIUMS.forEach(s => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.id = 'card-' + s.id;
        div.innerHTML = `
            <div style="flex:1; min-width:0;">
                <div class="item-name">${s.flag} ${s.name}</div>
                <div class="item-sub">${s.city} · ${s.capacity} places</div>
            </div>`;
        div.addEventListener('click', () => {
            setActiveCard(s.id);
            openPopup([s.lng, s.lat], buildStadiumPopup(s));
            map.flyTo({ center: [s.lng, s.lat], zoom: 13, pitch: 55, duration: 1100 });
        });
        container.appendChild(div);
    });

    // Créer marqueurs
    STADIUMS.forEach(s => {
        const el = createStadiumMarkerEl();
        el.addEventListener('mouseenter', () => {
            if (hoverPopup) hoverPopup.remove();
            hoverPopup = new maplibregl.Popup({ offset: 18, closeButton: false, closeOnClick: false, className: 'custom-popup' })
                .setLngLat([s.lng, s.lat])
                .setHTML(`<div style="font-weight:700; font-size:0.85rem;">${s.flag} ${s.name}</div><div style="font-size:0.7rem; opacity:0.75;">${s.city} · ${s.capacity}</div>`)
                .addTo(map);
        });
        el.addEventListener('mouseleave', () => { if (hoverPopup) { hoverPopup.remove(); hoverPopup = null; } });
        el.addEventListener('click', e => {
            e.stopPropagation();
            setActiveCard(s.id);
            openPopup([s.lng, s.lat], buildStadiumPopup(s));
            map.flyTo({ center: [s.lng, s.lat], zoom: 13, pitch: 55, duration: 1100 });
        });
        const marker = new maplibregl.Marker({ element: el }).setLngLat([s.lng, s.lat]).addTo(map);
        stadiumMarkers.push(marker);
    });
}

// ======================== MODE NATIONS ========================
async function showTeams() {
    clearAll();
    currentMode = 'teams';
    document.getElementById('sidebar-icon').className = 'fas fa-globe-americas';
    document.getElementById('sidebar-title').textContent = 'Nations participantes';
    document.getElementById('sidebar-count').textContent = '48';
    document.getElementById('switch-view').innerHTML = '<i class="fas fa-landmark"></i> Voir les Stades hôtes';
    document.getElementById('legend').classList.add('visible');
    document.getElementById('stadium-filters').style.display = 'none';
    document.getElementById('team-filters').style.display = 'block';
    document.getElementById('filter-container').style.display = 'block';

    map.flyTo({ center: [10, 20], zoom: 2.0, pitch: 30, bearing: 0, duration: 1300 });

    // Charger et afficher pays colorés
    await ensureCountryLayer();
    if (map.getLayer('country-fill')) map.setLayoutProperty('country-fill', 'visibility', 'visible');
    if (map.getLayer('country-outline')) map.setLayoutProperty('country-outline', 'visibility', 'visible');

    // Sidebar
    const container = document.getElementById('item-list');
    container.innerHTML = '';
    TEAMS.forEach(t => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.id = 'card-' + t.id;
        const rank = FIFA_RANKINGS[t.code] || '—'; // Récupère le classement FIFA pour l'équipe, ou '—' si non disponible
        const rankStr = rank !== '—' ? `🏅#${rank}` : ''; 

        div.innerHTML = `
            <img src="${t.flag}" style="width:28px; height:19px; object-fit:cover; border-radius:3px; flex-shrink:0;" onerror="this.style.display='none'" alt="">
            <div style="flex:1; min-width:0;">
                <div class="item-name">${t.name} (${t.code})</div>
                <div class="item-sub">Groupe ${t.group} · ${t.conf} ${rankStr ? '· FIFA '+rankStr : ''}</div>
            </div>
        `;
        div.addEventListener('click', () => {
            setActiveCard(t.id);
            openPopup([t.lng, t.lat], buildTeamPopup(t));
            map.flyTo({ center: [t.lng, t.lat], zoom: 3.8, pitch: 30, duration: 1100 });
        });
        container.appendChild(div);
    });

    // Marqueurs équipes
    TEAMS.forEach(t => {
        const el = document.createElement('div');
        el.className = 'team-marker';
        el.innerHTML = t.icon;
        el.title = t.name;
        el.addEventListener('mouseenter', () => {
            if (hoverPopup) hoverPopup.remove();
            hoverPopup = new maplibregl.Popup({ offset: 18, closeButton: false, closeOnClick: false, className: 'custom-popup' })
                .setLngLat([t.lng, t.lat])
                .setHTML(`<div style="display:flex;align-items:center;gap:8px;"><img src="${t.flag}" style="width:26px;border-radius:3px;" onerror="this.style.display='none'"><div><div style="font-weight:700;font-size:0.85rem;">${t.name}</div><div style="font-size:0.68rem;opacity:0.75;">Groupe ${t.group} · ${t.conf}</div></div></div>`)
                .addTo(map);
        });
        el.addEventListener('mouseleave', () => { if (hoverPopup) { hoverPopup.remove(); hoverPopup = null; } });
        el.addEventListener('click', e => {
            e.stopPropagation();
            setActiveCard(t.id);
            openPopup([t.lng, t.lat], buildTeamPopup(t));
            map.flyTo({ center: [t.lng, t.lat], zoom: 3.8, pitch: 30, duration: 1100 });
        });
        const marker = new maplibregl.Marker({ element: el }).setLngLat([t.lng, t.lat]).addTo(map);
        teamMarkers.push(marker);
    });
}

// ======================== COUCHE PAYS ========================
async function ensureCountryLayer() {
    if (countriesGeoJSONLoaded) return;
    try {
        // Utiliser un GeoJSON mondial plus léger via Natural Earth / GeoJSON-countries
        const resp = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
        const data = await resp.json();

        // Marquer les pays participants
        data.features.forEach(f => {
            const iso3 = f.properties.ISO_A3 || '';
            const nameEn = (f.properties.ADMIN || f.properties.name || '').trim();
            const isParticipant = PARTICIPANT_ISO3.has(iso3) || PARTICIPANT_NAME_EN.has(nameEn);
            f.properties.participant = isParticipant ? 1 : 0;
        });

        map.addSource('countries-wc', { type: 'geojson', data });

        map.addLayer({
            id: 'country-fill',
            type: 'fill',
            source: 'countries-wc',
            paint: {
                'fill-color': ['case', ['==', ['get', 'participant'], 1], '#16a34a', 'rgba(148,163,184,0.12)'],
                'fill-opacity': ['case', ['==', ['get', 'participant'], 1], 0.65, 0.3]
            }
        });
        map.addLayer({
            id: 'country-outline',
            type: 'line',
            source: 'countries-wc',
            paint: {
                'line-color': ['case', ['==', ['get', 'participant'], 1], '#eab308', 'rgba(148,163,184,0.2)'],
                'line-width': ['case', ['==', ['get', 'participant'], 1], 1.5, 0.3]
            }
        });

        // Clic sur un pays participant → ouvre popup équipe correspondante
        map.on('click', 'country-fill', e => {
            if (currentMode !== 'teams') return;
            const nameEn = (e.features[0].properties.ADMIN || e.features[0].properties.name || '').trim();
            const iso3 = e.features[0].properties.ISO_A3 || '';
            const isParticipant = e.features[0].properties.participant === 1;
            if (!isParticipant) return;
            // Trouver l'équipe correspondante
            const team = TEAMS.find(t => {
                const tIso = { MEX:'MEX',CAN:'CAN',USA:'USA',PAN:'PAN',HTI:'HTI',CUW:'CUW',
                    BRA:'BRA',ARG:'ARG',COL:'COL',URY:'URY',ECU:'ECU',PRY:'PRY',
                    FRA:'FRA',DEU:'DEU',ESP:'ESP',ENG:'GBR',PRT:'PRT',NLD:'NLD',HRV:'HRV',
                    BEL:'BEL',CHE:'CHE',AUT:'AUT',BIH:'BIH',CZE:'CZE',NOR:'NOR',SCO:'GBR',
                    SWE:'SWE',TUR:'TUR',JPN:'JPN',KOR:'KOR',AUS:'AUS',IRN:'IRN',SAU:'SAU',
                    QAT:'QAT',IRQ:'IRQ',JOR:'JOR',UZB:'UZB',MAR:'MAR',SEN:'SEN',
                    CIV:'CIV',EGY:'EGY',COD:'COD',ALG:'DZA',GHA:'GHA',TUN:'TUN',ZAF:'ZAF',CPV:'CPV',NZL:'NZL'
                }[t.code];
                return tIso === iso3 ||
                    PARTICIPANT_NAME_EN.has(nameEn) && (nameEn.toLowerCase().includes(t.name.toLowerCase()) || t.name.toLowerCase().includes(nameEn.toLowerCase().slice(0,6)));
            });
            if (team) {
                setActiveCard(team.id);
                openPopup([e.lngLat.lng, e.lngLat.lat], buildTeamPopup(team));
            }
        });

        map.on('mouseenter', 'country-fill', () => {
            if (currentMode === 'teams') map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'country-fill', () => { map.getCanvas().style.cursor = ''; });

        countriesGeoJSONLoaded = true;
    } catch(err) {
        console.warn('Impossible de charger le GeoJSON des pays:', err);
    }
}


// FONCTION DE FILTRAGE

function filterItems() {
    const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
    const cards = document.querySelectorAll('.item-card');
    let visibleCount = 0;

    cards.forEach(card => {
        const id = card.id.replace('card-', '');
        let show = true;

        // Filtre recherche
        const text = card.innerText.toLowerCase();
        if (searchQuery && !text.includes(searchQuery)) show = false;

        if (show && currentMode === 'stadiums') {
            const stadium = STADIUMS.find(s => s.id === id);
            if (!stadium) show = false;
            else {
                // Filtre pays
                if (filterState.country !== 'all' && stadium.country !== filterState.country) show = false;
                // Filtre capacité
                if (filterState.capacity !== 'all') {
                    const cap = parseInt(stadium.capacity.replace(/[^0-9]/g, ''));
                    if (isNaN(cap) || cap < parseInt(filterState.capacity)) show = false;
                }
            }
        }

        if (show && currentMode === 'teams') {
            const team = TEAMS.find(t => t.id === id);
            if (!team) show = false;
            else if (filterState.conf !== 'all' && team.conf !== filterState.conf) show = false;
        }

        card.style.display = show ? '' : 'none';
        if (show) visibleCount++;
    });

    document.getElementById('sidebar-count').textContent = visibleCount;
}

// ======================== INIT CARTE ========================
async function initMap() {
    map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/bright',
        center: [-99.0, 35.0],
        zoom: 3.2,
        pitch: 45,
        bearing: 0,
        antialias: true
    });

    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

    map.on('style.load', () => {
        try { map.setProjection({ type: 'globe' }); } catch(e) {}
    });

    map.on('load', () => {
        showStadiums();
    });

    map.on('click', () => {
        // Clic vide ferme la popup
        if (activePopup && !activePopup._content) { activePopup.remove(); activePopup = null; }
    });
}

// Gestion des filtres
document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', function() {
        const group = this.dataset.group;
        const value = this.dataset.filter;
        // Désactiver les autres chips du même groupe
        document.querySelectorAll(`.filter-chip[data-group="${group}"]`).forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        // Mettre à jour l'état
        if (group === 'country') filterState.country = value;
        else if (group === 'capacity') filterState.capacity = value;
        else if (group === 'conf') filterState.conf = value;
        filterItems();
    });
});

// Bouton bascule
document.getElementById('switch-view').addEventListener('click', () => {
    if (currentMode === 'stadiums') showTeams();
    else showStadiums();
});

initMap();
</script>
